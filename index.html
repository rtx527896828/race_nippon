vec3 hash32(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); p3 += dot(p3, p3.yxz+33.33); return fract((p3.xxy+p3.yzz)*p3.zyx); }

SHADER_CHUNKS.lamps = (function () {
  const f = (x) => x.toFixed(2);

  return `
const float LSP[${NL}] = ${arr('sp')}; const float LDA[${NL}] = ${arr('dA')}; const float LDB[${NL}] = ${arr('dB')};
const float LHT[${NL}] = ${arr('h')}; const float LIN[${NL}] = ${arr('I')};
const vec3 LCOL[${NL}] = vec3[${NL}](${LAMPS.map((l) => 'vec3(' + l.col.map(f).join(',') + ')').join(',')});
// tc = (d, s, h, lampK); N world normal; T track tangent (xz). returns diffuse irradiance, adds specular to spec
vec3 lampLight(vec4 tc, vec3 N, vec2 T, int kind, vec3 V, float shin, inout vec3 spec){
  float sp = LSP[kind], h = LHT[kind]; vec3 col = LCOL[kind]*LIN[kind];

  vec3 Rw = vec3(-T.y, 0.0, T.x), Tw = vec3(T.x, 0.0, T.y);

    float kk = floor(tc.y/sp - so + 0.5);

      vec3 v = vec3(dl - tc.x, sk - tc.y, h - tc.z);
      float r2 = dot(v,v); float ir = inversesqrt(r2);
      vec3 Lw = (Rw*v.x + Tw*v.y + vec3(0.0,1.0,0.0)*v.z)*ir;

}
`;

// terrain between the streets (mostly hidden by buildings)

// tiling noise texture (4 independent channels)
function mkNoiseTex() {
  const N = 256, data = new Uint8Array(N * N * 4);
  const tn = (x, y, cells, seed) => {
    const fx = (x / N) * cells, fy = (y / N) * cells, xi = Math.floor(fx), yi = Math.floor(fy);
    let u = fx - xi, v = fy - yi; u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
    const h = (a, b) => hash2I(pmod(a, cells) + seed * 131, pmod(b, cells) + seed * 977);
    return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v);
  };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = (y * N + x) * 4;
    data[k] = 255 * sat(0.5 * tn(x, y, 8, 1) + 0.3 * tn(x, y, 16, 2) + 0.2 * tn(x, y, 32, 3) + 0.0);
    data[k + 1] = 255 * sat(0.45 * tn(x, y, 8, 4) + 0.3 * tn(x, y, 16, 5) + 0.25 * tn(x, y, 64, 6));
    data[k + 2] = 255 * sat(0.5 * tn(x, y, 64, 7) + 0.5 * tn(x, y, 128, 8));
    data[k + 3] = 255 * sat(0.4 * tn(x, y, 16, 9) + 0.3 * tn(x, y, 32, 10) + 0.3 * tn(x, y, 128, 11));
  }
  return mkTex(N, N, { fmt: 'rgba8', data, mips: true, wrap: 'repeat', aniso: 8 });
}

// ---------------------------------------------------------------------------
// "Open" roads: motorways (on the ground, on viaducts and great bridges, in
// tunnels), country roads, the mountain pass, parking areas. No kerbs and no
// street canyons: barriers, guard rails, verges that run out into the terrain.

const TUNH = 6.0;
const LBIO = [0, 0, 0];
// what grows there: out[0] = hard ground of the built-up plain (1) .. open country (0), out[1] = woodland
function landBiome(x, z, out) {
  let urban = 1 - smoothstep(-3450, -3950, x); if (z > 6250) urban *= 1 - smoothstep(6250, 6700, z);
  urban = Math.max(urban, 0.75 * (1 - smoothstep(260, 520, Math.hypot(x + 8600, z - 7350))));
  if (x < -15500) for (const F of FLATS) { const d = Math.hypot(x - F[0], z - F[1]); if (d < F[3]) urban = Math.max(urban, 0.85 * (1 - smoothstep(F[2] * 0.7, F[3] * 0.9, d))); }      // the towns of the west
  let dT = distPolyline(TOMEI_CTRL, x, z); if (x < -7600) for (const C of CORRIDORS) dT = Math.min(dT, distPolyline(C, x, z));

  let forest = smoothstep(0.30, 0.55, n * 0.6 + 0.55 * smoothstep(90, 520, dT)) * (1 - urban);
  const r = Math.hypot(x - FUJI.x, z - FUJI.z); if (r < 5200) forest = Math.max(forest, (1 - smoothstep(4300, 5200, r)) * (1 - urban) * smoothstep(0.12, 0.3, n + 0.25 * smoothstep(3600, 2600, r)));
  if (z > 10300 && x < -8700 && x > -27000) forest *= 1 - 0.92 * smoothstep(10300, 11000, z);      // the coastal plain is open: fields, the sea on one side and the mountain on the other
  // tea terraces on the hills between Shizuoka and Lake Hamana (and a few above Shizuoka)
  const tea = x < -17900 && x > -23300 ? smoothstep(-17900, -18700, x) * smoothstep(-23300, -22500, x) * smoothstep(0.35, 0.6, vnoise2(x / 420 + 1.5, z / 420 + 7.5) + 0.25) * (1 - urban) : 0;

}
function landTint(mb, v0) {      // vertices written since v0 become "land": tc = (urban, forest, -, no lamps)

  const strip = (fa, fb, mat, o) => sweepStrip(mb, 0, n, fa, fb, mat, o);

// ---- utility poles and overhead wires (back streets) ---------------------------------------------------------------
function buildWires() {
  const T = TRK, P = [0, 0, 0], L = LAMPS[KIND.BACK];
  const wireSpan = (a, b, sag) => { const N = 8; for (let k = 0; k < N; k++) { const u0 = k / N, u1 = (k + 1) / N, s0 = 4 * sag * u0 * (1 - u0), s1 = 4 * sag * u1 * (1 - u1);
    C.lines.push(lerp(a[0], b[0], u0), lerp(a[1], b[1], u0) - s0, lerp(a[2], b[2], u0), lerp(a[0], b[0], u1), lerp(a[1], b[1], u1) - s1, lerp(a[2], b[2], u1)); } };
  const prev = [null, null]; let lastAny = null;
  for (let q = 0; q * L.sp * 0.5 < T.len; q++) {
    const s = q * L.sp * 0.5, row = q & 1, i = trkIdx(T, s);
    if (T.kind[i] !== KIND.BACK || T.lampK[i] < 0.4) { prev[0] = prev[1] = lastAny = null; continue; }
    const d = row ? 4.95 : -4.95; trkPos(T, s, d, 7.5, P); const p = [P[0], P[1], P[2]], tc = tcAt(s, d, {});
    wmBox(W.wm, P[0], P[1] - 0.15, P[2], -T.tz[i], T.tx[i], 0.75, 0.04, 0.04, MAT.STEEL, tc);
    if (row) wmBox(W.wm, P[0], P[1] - 1.6, P[2], T.tx[i], T.tz[i], 0.22, 0.34, 0.22, MAT.STEEL, tc);   // pole transformer
    if (prev[row]) for (const dy of [0, -0.45, -0.9, -1.7]) wireSpan([prev[row][0], prev[row][1] + dy, prev[row][2]], [p[0], p[1] + dy, p[2]], 0.35 + (dy < -1 ? 0.3 : 0));
    if (lastAny) { wireSpan([lastAny[0], lastAny[1] - 0.2, lastAny[2]], [p[0], p[1] - 0.3, p[2]], 0.45); wireSpan([lastAny[0], lastAny[1] - 1.2, lastAny[2]], [p[0], p[1] - 1.0, p[2]], 0.7); }
    prev[row] = p; lastAny = p;
  }
}

function postInit() {
  const V = '#include <fsvs>';
  R.P.mblur = new Prog('mblur', V, SHADER_CHUNKS.p_mblur);
  R.P.down = new Prog('down', V, SHADER_CHUNKS.p_down);
  R.P.up = new Prog('up', V, SHADER_CHUNKS.p_up);
  R.P.streak = new Prog('streak', V, SHADER_CHUNKS.p_streak);
  R.P.dof = new Prog('dof', V, SHADER_CHUNKS.p_dof);
  R.P.comp = new Prog('comp', V, SHADER_CHUNKS.p_comp);
  R.P.fxaa = new Prog('fxaa', V, SHADER_CHUNKS.p_fxaa);
}
function postResize(w, h) {
  const P = POST;
  freeRT(P.rtA); freeRT(P.ldr); freeRT(P.stA); freeRT(P.stB); freeRT(P.half); for (const r of P.bd) freeRT(r); for (const r of P.bu) freeRT(r);
  P.rtA = mkRT(w, h, { fmt: 'rgba16f' });
  P.ldr = mkRT(w, h, { fmt: 'rgba8' });
  P.half = mkRT(w >> 1, h >> 1, { fmt: 'rgba16f' });
  P.bd = []; P.bu = [];
  let bw = w >> 1, bh = h >> 1;
  for (let i = 0; i < P.n; i++) { P.bd.push(mkRT(bw, bh, { fmt: 'r11' })); if (i < P.n - 1) P.bu.push(mkRT(bw, bh, { fmt: 'r11' })); bw = Math.max(2, bw >> 1); bh = Math.max(2, bh >> 1); }
  P.stA = mkRT(w >> 2, h >> 2, { fmt: 'r11' }); P.stB = mkRT(w >> 2, h >> 2, { fmt: 'r11' });
}
function postFrame(G) {
  const P = POST; let src = R.rtScene, p;
  // 1. camera motion blur
  if (P.mblur > 0 && R.frame > 1 && !G.paused) {
    bindRT(P.rtA); p = R.P.mblur.use(); p.tex('tColor', 0, src.tex); p.tex('tDepth', 1, R.rtScene.depth);
    p.f4('uMB', P.mblur * Math.min(1.6, 0.0167 / Math.max(R.dt, 0.004)), 0.035, 0, 0); drawFS(); src = P.rtA;
  }
  // 2. depth of field (cinematic cameras)
  const dofOn = P.dof > 0;
  if (dofOn) {
    bindRT(P.half); p = R.P.dof.use(); p.tex('tColor', 0, src.tex); p.tex('tDepth', 1, R.rtScene.depth);
    p.f4('uDof', P.focus, P.aperture * P.dof, R.cam.near, R.cam.far); drawFS();
  }
  // 3. bloom pyramid
  let prev = src;
  for (let i = 0; i < P.n; i++) {
    bindRT(P.bd[i]); p = R.P.down.use(); p.tex('tSrc', 0, prev.tex); p.f4('uPx', 1 / prev.w, 1 / prev.h, i === 0 ? 1 : 0, P.thresh); drawFS(); prev = P.bd[i];
  }
  let lo = P.bd[P.n - 1], wsum = P.bw[P.n - 1];
  for (let i = P.n - 2; i >= 0; i--) {
    bindRT(P.bu[i]); p = R.P.up.use(); p.tex('tLo', 0, lo.tex); p.tex('tHi', 1, P.bd[i].tex);
    p.f4('uPx', 1.0 / lo.w, 1.0 / lo.h, P.bw[i] / P.bw[P.n - 1], 0); drawFS(); lo = P.bu[i]; wsum += P.bw[i];

  const st = [P.stA, P.stB]; let sin = P.bd[1], k = 0;

  for (let i = 0; i < 3; i++) {
    bindRT(st[k]); p = R.P.streak.use(); p.tex('tSrc', 0, sin.tex); p.f4('uPx', steps[i] / sin.w, i === 0 ? 1.4 : 0, i === 0 ? 1.0 : 1.0, 0); drawFS(); sin = st[k]; k ^= 1;
  }
  // 5. composite + tonemap
  bindRT(P.ldr); p = R.P.comp.use();
  p.tex('tScene', 0, src.tex); p.tex('tBloom', 1, P.bu[0].tex); p.tex('tStreak', 2, sin.tex); p.tex('tDof', 3, dofOn ? P.half.tex : R.tBlack);

}
